name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: painting-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked --extra images
      - run: uv run --locked --extra images ruff check tools tests
      - run: uv run --locked --extra images ruff format --check tools tests
      - run: uv run --locked --extra images ty check
      - run: uv run --locked --extra images pytest
      - run: uv build --no-sources
      - run: uv run --isolated --no-project --python 3.15.0 --with dist/*.whl painting-catalog --help
