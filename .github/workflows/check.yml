name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: painting-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked --extra images
      - run: uv run --locked --extra images ruff check tools tests
      - run: uv run --locked --extra images ruff format --check tools tests
      - run: uv run --locked --extra images ty check
      - run: uv run --locked --extra images pytest
      - run: uv build --no-sources
      - run: uv run --isolated --no-project --python 3.15.0 --with dist/*.whl painting-catalog --help
