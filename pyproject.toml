[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painting-tv-tools"
version = "0.1.0"
description = "Anki painting catalog extraction and offline image pack tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
painting-catalog = "tools.painting_catalog:main"

[tool.setuptools]
packages = ["tools"]
